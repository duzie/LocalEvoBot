<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话交互 - 小冬瓜智能助手</title>
    <style>
        :root{--bg1:#a8e6cf;--bg2:#dcedc1;--bg3:#ffd3b6;--bg4:#ffaaa5;--bg5:#ff8b94;--card:rgba(255,255,255,.85);--border:rgba(255,255,255,.3);--text:#1f2937;--muted:#6b7280;--primary:#ec4899;--primary2:#f97316;--green:#16a34a;--radius:14px;--radius2:999px;--mono:ui-monospace,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;--sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
        *{box-sizing:border-box}
        body{margin:0;font-family:var(--sans);color:var(--text);background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 25%,var(--bg3) 50%,var(--bg4) 75%,var(--bg5) 100%)}
        .app{max-width:1100px;margin:0 auto;padding:0 12px}
        .header{margin-top:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between}
        .brand{font-weight:800;display:flex;align-items:center;gap:10px}
        .status{font-size:12px;display:flex;align-items:center;gap:8px;color:var(--muted)}
        .dot{width:10px;height:10px;border-radius:999px;background:#9ca3af;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
        .dot.online{background:var(--green)}
        .nav{margin:10px 0;display:flex;gap:8px;flex-wrap:wrap}
        .nav a{display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid var(--border);text-decoration:none;color:rgba(31,41,55,.9);font-weight:700}
        .nav a.active{background:rgba(255,255,255,.95);border-color:rgba(236,72,153,.45);color:rgba(236,72,153,.95)}
        .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px rgba(31,38,135,.18)}
        .panelHeader{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:space-between}
        .panelTitle{display:flex;align-items:center;gap:10px;font-weight:800}
        .pill{font-size:12px;color:var(--muted);background:rgba(255,255,255,.55);border:1px solid var(--border);padding:5px 10px;border-radius:999px}
        .select{height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.75);padding:0 12px;outline:none}
        .chatSplit{padding:12px;display:flex;gap:12px;height:60vh;min-height:0;overflow:hidden}
        .chatPane,.auxPane{display:flex;flex-direction:column;min-height:0;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.55);border-radius:var(--radius);overflow:hidden}
        .chatPane{flex:2 1 0;min-width:0}
        .auxPane{flex:1 1 0;min-width:0}
        .chatList,.auxList{padding:12px;overflow:auto;flex:1 1 auto}
        .auxHeader{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:space-between}
        .auxTitle{font-weight:800;font-size:13px;color:rgba(31,41,55,.9)}
        .chatInput{display:flex;gap:10px;padding:12px;border-top:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.5);border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius);align-items:flex-end}
        .input{border-radius:var(--radius2);border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.75);padding:10px 12px;outline:none;flex:1 1 auto;resize:vertical;min-height:42px}
        .btn{height:42px;padding:0 14px;border-radius:var(--radius2);border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.75);cursor:pointer}
        .btn.primary{border-color:rgba(236,72,153,.55);background:linear-gradient(135deg,var(--primary) 0%,var(--primary2) 100%);color:#fff}
        .btn.ghost{background:rgba(255,255,255,.55)}
        .btn.recording{background:linear-gradient(135deg,rgba(239,68,68,.9) 0%,rgba(248,113,113,.95) 100%);border-color:rgba(239,68,68,.6);color:#fff}
        .msg{display:flex;margin:10px 0}
        .msg.user{justify-content:flex-end}
        .bubble{max-width:820px;width:fit-content;padding:10px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word;box-shadow:0 6px 20px rgba(31,38,135,.12);font-size:14px;line-height:1.35}
        .bubble.user{background:linear-gradient(135deg,rgba(255,154,158,.95) 0%,rgba(250,208,196,.95) 100%);color:#1f2937}
        .bubble.agent{background:linear-gradient(135deg,rgba(161,196,253,.95) 0%,rgba(194,233,251,.95) 100%);color:#1f2937}
        .bubble.system{background:rgba(255,255,255,.6);color:#4b5563;font-size:12px;font-style:italic}
        .auxMsg{display:flex;margin:10px 0}
        .auxBubble{width:100%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word;box-shadow:0 6px 20px rgba(31,38,135,.10);background:rgba(255,255,255,.6);color:#4b5563;font-size:12px;font-style:italic}
        .confirmInline{display:none;margin:12px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.75);box-shadow:0 10px 25px rgba(15,23,42,.12);flex-direction:column;gap:10px}
        .confirmInline.active{display:flex}
        .confirmInlineTitle{font-weight:800;font-size:13px;color:rgba(31,41,55,.9)}
        .confirmInlineContent{font-size:13px;color:rgba(55,65,81,.95);white-space:pre-wrap;word-break:break-word}
        .confirmInlineActions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
        .confirmInlineStatus{font-size:12px;color:var(--muted)}
        @media (max-width:640px){.header{flex-wrap:wrap;gap:10px}.status{width:100%;justify-content:flex-start}.chatSplit{flex-direction:column;height:auto}.auxPane{display:none}.bubble{max-width:92vw}}
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="brand"><span>🍈</span><span>小冬瓜智能助手</span></div>
            <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">离线</span></div>
        </header>
        <nav class="nav">
            <a href="/index.html" class="active">对话</a>
            <a href="/logs.html">日志</a>
            <a href="/config.html">配置</a>
            <a href="/templates.html">模板</a>
            <a href="/memories.html">记忆</a>
            <a href="/cookies.html">Cookie</a>
        </nav>
        <section class="card">
            <div class="panelHeader">
                <div class="panelTitle">
                    <span>模型</span>
                    <select id="modelSelect" class="select" style="min-width:160px;flex:0 0 auto;"></select>
                    <span id="modelInfo" class="pill"></span>
                </div>
                <span id="chatConn" class="pill">未连接</span>
            </div>
            <div class="chatSplit">
                <div class="chatPane">
                    <div id="chatList" class="chatList"></div>
                    <div class="chatInput">
                        <textarea id="chatInput" class="input" rows="3" placeholder="输入指令...（Enter 发送，Shift+Enter 换行）" autocomplete="off"></textarea>
                        <button id="voiceBtn" class="btn ghost" type="button">按住说话</button>
                        <button id="sendBtn" class="btn primary" type="button">发送</button>
                    </div>
                </div>
                <div class="auxPane">
                    <div class="auxHeader">
                        <div class="auxTitle">提示窗口（总结/模板/系统）</div>
                        <button id="clearAuxBtn" class="btn ghost" type="button">清空</button>
                    </div>
                    <div id="confirmInline" class="confirmInline">
                        <div id="confirmInlineTitle" class="confirmInlineTitle">确认</div>
                        <div id="confirmInlineContent" class="confirmInlineContent"></div>
                        <div class="confirmInlineActions">
                            <button id="confirmInlineCancel" class="btn ghost" type="button">否</button>
                            <button id="confirmInlineOk" class="btn primary" type="button">是</button>
                        </div>
                        <div id="confirmInlineStatus" class="confirmInlineStatus"></div>
                    </div>
                    <div id="auxList" class="auxList"></div>
                </div>
            </div>
        </section>
    </div>

    <script>
        (function(){
            function el(id){return document.getElementById(id)}
            var state = {chatConnected:false,logConnected:false,chatWs:null,logWs:null,modelCurrent:'doubao',modelOptions:[],lastAgentBubble:null,auxCapture:false,isSending:false,isRunning:false,confirmTimer:null,confirmCountdown:null}

            function setOnline(online){
                var dot = el('statusDot')
                var text = el('statusText')
                if (online){
                    dot.classList.add('online')
                    text.textContent = '在线'
                }else{
                    dot.classList.remove('online')
                    text.textContent = '离线'
                }
            }

            function setChatConn(connected){
                state.chatConnected = connected
                el('chatConn').textContent = connected ? '已连接' : '未连接'
                updateSendButton()
                el('chatInput').disabled = !connected
            }

            function setModelInfo(text){
                el('modelInfo').textContent = text || ''
            }

            function setRunning(running){
                state.isRunning = !!running
                updateSendButton()
            }

            function setSending(sending){
                state.isSending = !!sending
                updateSendButton()
            }

            function updateSendButton(){
                var btn = el('sendBtn')
                var connected = state.chatConnected
                if (!connected){
                    btn.disabled = true
                    btn.textContent = '发送'
                    return
                }
                if (state.isRunning){
                    btn.disabled = false
                    btn.textContent = '停止'
                }else{
                    btn.textContent = '发送'
                    btn.disabled = state.isSending || !connected
                }
            }

            function appendAuxMessage(raw){
                var msg = (raw == null ? '' : String(raw))
                if (!msg) return
                var list = el('auxList')
                if (!list) return
                var wrap = document.createElement('div')
                wrap.className = 'auxMsg'
                var bubble = document.createElement('div')
                bubble.className = 'auxBubble'
                bubble.textContent = msg
                wrap.appendChild(bubble)
                list.appendChild(wrap)
                list.scrollTop = list.scrollHeight
            }

            function appendChatMessage(raw, opts){
                var msg = (raw == null ? '' : String(raw))
                if (!msg) return
                opts = opts || {}
                if (opts.allowConfirm !== false){
                    var confirmInfo = parseConfirmPrompt(msg)
                    if (confirmInfo){
                        state.auxCapture = false
                        appendAuxMessage(msg.replace(/\r/g, ''))
                        showConfirmInline(confirmInfo)
                        return
                    }
                }
                var type = 'system'
                var isUser = msg.startsWith('User:') || msg.startsWith('User :')
                var isAgent = msg.startsWith('Agent:')
                var isSystem = msg.startsWith('>>>')
                if (isUser) type = 'user'
                else if (isAgent) type = 'agent'
                else if (isSystem) type = 'system'

                if (isSystem){
                    state.auxCapture = false
                    appendAuxMessage(msg.replace(/\r/g, ''))
                    return
                }

                if (isAgent){
                    var agentText = msg.slice('Agent:'.length).trim()
                    if (agentText.indexOf('已生成个人认知总结') !== -1 || agentText.indexOf('检索到可用模板') !== -1){
                        state.auxCapture = true
                        state.lastAgentBubble = null
                        appendAuxMessage(msg.replace(/\r/g, ''))
                        return
                    }
                    state.auxCapture = false
                }

                if (isUser){
                    state.auxCapture = false
                }

                if (!isUser && !isAgent && !isSystem && state.lastAgentBubble){
                    if (state.auxCapture){
                        appendAuxMessage(msg.replace(/\r/g, ''))
                        return
                    }
                    state.lastAgentBubble.textContent += msg
                    el('chatList').scrollTop = el('chatList').scrollHeight
                    return
                }

                if (!isUser && !isAgent && !isSystem){
                    appendAuxMessage(msg.replace(/\r/g, ''))
                    return
                }

                var wrap = document.createElement('div')
                wrap.className = 'msg' + (type === 'user' ? ' user' : '')
                var bubble = document.createElement('div')
                bubble.className = 'bubble ' + type
                if (isAgent){
                    var content = msg.slice('Agent:'.length)
                    if (content.startsWith(' ')) content = content.slice(1)
                    bubble.textContent = content
                    state.lastAgentBubble = bubble
                }else{
                    bubble.textContent = msg
                    state.lastAgentBubble = null
                }
                wrap.appendChild(bubble)
                el('chatList').appendChild(wrap)
                el('chatList').scrollTop = el('chatList').scrollHeight
            }

            function wsUrl(path){
                var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:'
                return protocol + '//' + window.location.host + path
            }

            function connectChatWS(){
                try{ if (state.chatWs) state.chatWs.close() }catch(e){}
                var ws = new WebSocket(wsUrl('/api/chat/ws'))
                state.chatWs = ws
                ws.onopen = function(){
                    setChatConn(true)
                    appendChatMessage('>>> 系统: 已连接到小冬瓜')
                }
                ws.onmessage = function(ev){
                    var data = ev.data || ''
                    if (typeof data === 'string' && data.indexOf('>>> 系统: 状态=') === 0){
                        if (data.indexOf('执行中') !== -1) setRunning(true)
                        if (data.indexOf('空闲') !== -1) setRunning(false)
                        if (data.indexOf('已停止') !== -1) setRunning(false)
                    }
                    appendChatMessage(data)
                }
                ws.onclose = function(){
                    setChatConn(false)
                    appendChatMessage('>>> 系统: 连接断开，3秒后重连...')
                    setTimeout(connectChatWS, 3000)
                }
                ws.onerror = function(){
                    setChatConn(false)
                }
            }

            function connectLogWS(){
                try{ if (state.logWs) state.logWs.close() }catch(e){}
                var ws = new WebSocket(wsUrl('/api/logs/ws'))
                state.logWs = ws
                ws.onopen = function(){
                    state.logConnected = true
                    setOnline(true)
                }
                ws.onclose = function(){
                    state.logConnected = false
                    setOnline(false)
                    setTimeout(connectLogWS, 3000)
                }
                ws.onerror = function(){
                    state.logConnected = false
                    setOnline(false)
                }
            }

            function sendMessageText(msg){
                var text = (msg || '').trim()
                if (!text || !state.chatConnected) return
                appendChatMessage('User: ' + text)
                setSending(true)
                fetch('/api/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                }).then(function(res){
                    if (!res.ok) appendChatMessage('>>> 系统: 发送失败')
                    setSending(false)
                    setRunning(true)
                }).catch(function(e){
                    appendChatMessage('>>> 系统: 发送出错 ' + e)
                    setSending(false)
                })
            }

            function sendMessageSilent(msg){
                var text = (msg || '').trim()
                if (!text || !state.chatConnected) return
                fetch('/api/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                }).then(function(res){
                    if (!res.ok) appendChatMessage('>>> 系统: 发送失败')
                }).catch(function(e){
                    appendChatMessage('>>> 系统: 发送出错 ' + e)
                })
            }

            function parseConfirmPrompt(msg){
                var text = String(msg || '')
                text = text.replace(/\r/g, '')
                text = text.replace(/^\s*User\s*:?\s*/i, '').trim()
                var timeoutMatch = text.match(/(\d+)\s*秒后自动放弃/)
                var timeoutSeconds = timeoutMatch ? parseInt(timeoutMatch[1], 10) : null
                if (text.indexOf('是否保存以上总结？') !== -1) {
                    return {title:'保存总结确认',content:text,okText:'保存',cancelText:'不保存',okValue:'yes',cancelValue:'no',timeoutSeconds:timeoutSeconds}
                }
                if (text.indexOf('是否使用该模板执行？') !== -1) {
                    return {title:'模板确认',content:text,okText:'使用',cancelText:'不使用',okValue:'yes',cancelValue:'no',timeoutSeconds:timeoutSeconds}
                }
                return null
            }

            function showConfirmInline(info){
                var box = el('confirmInline')
                var title = el('confirmInlineTitle')
                var content = el('confirmInlineContent')
                var ok = el('confirmInlineOk')
                var cancel = el('confirmInlineCancel')
                var status = el('confirmInlineStatus')
                title.textContent = info.title || '提示'
                content.textContent = info.content || ''
                ok.textContent = info.okText || '是'
                cancel.textContent = info.cancelText || '否'
                status.textContent = ''
                box.classList.add('active')
                var close = function(){
                    box.classList.remove('active')
                    ok.onclick = null
                    cancel.onclick = null
                    if (state.confirmTimer){ clearTimeout(state.confirmTimer); state.confirmTimer = null }
                    if (state.confirmCountdown){ clearInterval(state.confirmCountdown); state.confirmCountdown = null }
                }
                var startTimeout = function(){
                    var seconds = parseInt(info.timeoutSeconds, 10)
                    if (!seconds || isNaN(seconds) || seconds <= 0) return
                    var remain = seconds
                    status.textContent = '将在 ' + remain + ' 秒后自动放弃'
                    if (state.confirmCountdown) clearInterval(state.confirmCountdown)
                    state.confirmCountdown = setInterval(function(){
                        remain -= 1
                        if (remain <= 0){
                            clearInterval(state.confirmCountdown)
                            state.confirmCountdown = null
                        }else{
                            status.textContent = '将在 ' + remain + ' 秒后自动放弃'
                        }
                    }, 1000)
                    if (state.confirmTimer) clearTimeout(state.confirmTimer)
                    state.confirmTimer = setTimeout(function(){ close() }, seconds * 1000)
                }
                startTimeout()
                ok.onclick = function(){
                    sendMessageSilent(info.okValue || 'yes')
                    status.textContent = '已选择：' + (info.okText || '是')
                    ok.disabled = true
                    cancel.disabled = true
                    setTimeout(function(){
                        ok.disabled = false
                        cancel.disabled = false
                        close()
                    }, 1200)
                }
                cancel.onclick = function(){
                    sendMessageSilent(info.cancelValue || 'no')
                    status.textContent = '已选择：' + (info.cancelText || '否')
                    ok.disabled = true
                    cancel.disabled = true
                    setTimeout(function(){
                        ok.disabled = false
                        cancel.disabled = false
                        close()
                    }, 1200)
                }
            }

            function stopAgent(){
                if (!state.chatConnected) return
                fetch('/api/chat/stop', { method: 'POST' }).catch(function(){})
            }

            function sendOrStop(){
                if (state.isRunning){
                    stopAgent()
                    return
                }
                var input = el('chatInput')
                var msg = (input.value || '').trim()
                if (!msg || !state.chatConnected) return
                input.value = ''
                sendMessageText(msg)
            }

            function mergeBuffers(buffers){
                var length = 0
                buffers.forEach(function(b){ length += b.length })
                var result = new Float32Array(length)
                var offset = 0
                buffers.forEach(function(b){
                    result.set(b, offset)
                    offset += b.length
                })
                return result
            }

            function downsampleBuffer(buffer, inputRate, outputRate){
                if (outputRate === inputRate) return buffer
                var ratio = inputRate / outputRate
                var newLength = Math.round(buffer.length / ratio)
                var result = new Float32Array(newLength)
                var offsetResult = 0
                var offsetBuffer = 0
                while (offsetResult < result.length){
                    var nextOffsetBuffer = Math.round((offsetResult + 1) * ratio)
                    var accum = 0
                    var count = 0
                    for (var i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++){
                        accum += buffer[i]
                        count++
                    }
                    result[offsetResult] = count ? (accum / count) : 0
                    offsetResult++
                    offsetBuffer = nextOffsetBuffer
                }
                return result
            }

            function encodeWav(buffer, sampleRate){
                var length = buffer.length
                var bufferLength = 44 + length * 2
                var view = new DataView(new ArrayBuffer(bufferLength))
                function writeString(offset, str){
                    for (var i = 0; i < str.length; i++){
                        view.setUint8(offset + i, str.charCodeAt(i))
                    }
                }
                writeString(0, 'RIFF')
                view.setUint32(4, 36 + length * 2, true)
                writeString(8, 'WAVE')
                writeString(12, 'fmt ')
                view.setUint32(16, 16, true)
                view.setUint16(20, 1, true)
                view.setUint16(22, 1, true)
                view.setUint32(24, sampleRate, true)
                view.setUint32(28, sampleRate * 2, true)
                view.setUint16(32, 2, true)
                view.setUint16(34, 16, true)
                writeString(36, 'data')
                view.setUint32(40, length * 2, true)
                var offset = 44
                for (var i2 = 0; i2 < length; i2++, offset += 2){
                    var s = Math.max(-1, Math.min(1, buffer[i2]))
                    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true)
                }
                return new Blob([view], { type: 'audio/wav' })
            }

            var recordState = {active:false,context:null,stream:null,source:null,processor:null,buffers:[],sampleRate:16000}

            function setVoiceButtonRecording(recording){
                var btn = el('voiceBtn')
                if (!btn) return
                btn.classList.toggle('recording', recording)
                btn.textContent = recording ? '松开发送' : '按住说话'
            }

            function startVoiceRecord(){
                if (recordState.active || !state.chatConnected) return
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
                    appendChatMessage('>>> 系统: 浏览器不支持录音')
                    return
                }
                navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
                    recordState.active = true
                    recordState.buffers = []
                    recordState.stream = stream
                    var ctx = new (window.AudioContext || window.webkitAudioContext)()
                    recordState.context = ctx
                    recordState.sampleRate = ctx.sampleRate
                    var source = ctx.createMediaStreamSource(stream)
                    recordState.source = source
                    var processor = ctx.createScriptProcessor(4096, 1, 1)
                    recordState.processor = processor
                    processor.onaudioprocess = function(ev){
                        if (!recordState.active) return
                        var data = ev.inputBuffer.getChannelData(0)
                        recordState.buffers.push(new Float32Array(data))
                    }
                    source.connect(processor)
                    processor.connect(ctx.destination)
                    setVoiceButtonRecording(true)
                }).catch(function(e){
                    appendChatMessage('>>> 系统: 无法获取麦克风权限 ' + e)
                })
            }

            function stopVoiceRecord(){
                if (!recordState.active) return
                recordState.active = false
                setVoiceButtonRecording(false)
                try{ if (recordState.processor) recordState.processor.disconnect() }catch(e){}
                try{ if (recordState.source) recordState.source.disconnect() }catch(e){}
                try{ if (recordState.context) recordState.context.close() }catch(e){}
                if (recordState.stream){
                    recordState.stream.getTracks().forEach(function(t){ t.stop() })
                }
                var merged = mergeBuffers(recordState.buffers)
                if (!merged.length){
                    appendChatMessage('>>> 系统: 未捕获到语音')
                    return
                }
                var downsampled = downsampleBuffer(merged, recordState.sampleRate, 16000)
                var wavBlob = encodeWav(downsampled, 16000)
                var fd = new FormData()
                fd.append('audio', wavBlob, 'speech.wav')
                fetch('/api/chat/asr', { method: 'POST', body: fd }).then(function(res){
                    if (!res.ok) throw new Error('状态码 ' + res.status)
                    return res.json()
                }).then(function(data){
                    var text = (data && data.text) ? String(data.text).trim() : ''
                    if (!text){
                        appendChatMessage('>>> 系统: 未识别到内容')
                        return
                    }
                    sendMessageText(text)
                }).catch(function(e){
                    appendChatMessage('>>> 系统: 语音识别失败 ' + e)
                })
            }

            function loadModels(){
                fetch('/api/chat/models').then(function(r){return r.json()}).then(function(data){
                    state.modelOptions = data.models || []
                    state.modelCurrent = data.current || 'doubao'
                    var sel = el('modelSelect')
                    sel.innerHTML = ''
                    state.modelOptions.forEach(function(m){
                        var opt = document.createElement('option')
                        opt.value = m.id
                        opt.textContent = m.label
                        sel.appendChild(opt)
                    })
                    sel.value = state.modelCurrent
                    setModelInfo('当前: ' + (sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : sel.value))
                }).catch(function(e){
                    appendChatMessage('>>> 系统: 加载模型列表失败 ' + e)
                })
            }

            function changeModel(){
                var sel = el('modelSelect')
                var provider = sel.value
                if (!provider) return
                setModelInfo('切换中...')
                fetch('/api/chat/model', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ provider: provider })
                }).then(function(res){
                    if (res.ok){
                        appendChatMessage('>>> 系统: 已请求切换模型为 ' + provider)
                        setModelInfo('当前: ' + (sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : provider))
                    }else{
                        appendChatMessage('>>> 系统: 切换模型失败 (' + res.status + ')')
                        setModelInfo('切换失败')
                    }
                }).catch(function(e){
                    appendChatMessage('>>> 系统: 切换模型出错 ' + e)
                    setModelInfo('切换失败')
                })
            }

            function loadHistory(){
                fetch('/api/chat/history?limit=80').then(function(r){return r.json()}).then(function(data){
                    var list = (data && data.messages) ? data.messages : []
                    var chatList = el('chatList')
                    if (!chatList) return
                    chatList.textContent = ''
                    state.lastAgentBubble = null
                    state.auxCapture = false
                    var auxList = el('auxList')
                    if (auxList) auxList.textContent = ''
                    var confirmBox = el('confirmInline')
                    if (confirmBox) confirmBox.classList.remove('active')
                    list.forEach(function(item){
                        if (!item || !item.content) return
                        var role = item.role
                        var content = String(item.content)
                        if (role === 'user') appendChatMessage('User: ' + content, { allowConfirm: false })
                        else if (role === 'assistant') appendChatMessage('Agent: ' + content, { allowConfirm: false })
                    })
                }).catch(function(e){
                    appendChatMessage('>>> 系统: 加载历史对话失败 ' + e)
                })
            }

            el('sendBtn').addEventListener('click', sendOrStop)
            el('chatInput').addEventListener('keydown', function(e){
                if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){
                    e.preventDefault()
                    sendOrStop()
                }
            })
            var voiceBtn = el('voiceBtn')
            if (voiceBtn){
                voiceBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); startVoiceRecord() })
                voiceBtn.addEventListener('pointerup', function(e){ e.preventDefault(); stopVoiceRecord() })
                voiceBtn.addEventListener('pointerleave', function(e){ e.preventDefault(); stopVoiceRecord() })
                voiceBtn.addEventListener('pointercancel', function(e){ e.preventDefault(); stopVoiceRecord() })
            }
            el('clearAuxBtn').addEventListener('click', function(){ el('auxList').textContent = '' })
            el('modelSelect').addEventListener('change', changeModel)

            setOnline(false)
            setChatConn(false)
            setModelInfo('')
            loadHistory()
            loadModels()
            connectLogWS()
            connectChatWS()
        })();
    </script>
</body>
</html>
