<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运行日志 - 小冬瓜智能助手</title>
    <style>
        :root{--card:rgba(255,255,255,.88);--border:rgba(255,255,255,.3);--muted:#6b7280;--text:#1f2937;--primary:#ec4899;--primary2:#f97316;--radius:14px;--radius2:999px;--mono:ui-monospace,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;--sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
        *{box-sizing:border-box}
        body{margin:0;font-family:var(--sans);color:var(--text);background:linear-gradient(135deg,#a8e6cf 0%,#dcedc1 25%,#ffd3b6 50%,#ffaaa5 75%,#ff8b94 100%)}
        .app{max-width:1100px;margin:0 auto;padding:0 12px}
        .header{margin-top:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between}
        .brand{font-weight:800;display:flex;align-items:center;gap:10px}
        .nav{margin:10px 0;display:flex;gap:8px;flex-wrap:wrap}
        .nav a{display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid var(--border);text-decoration:none;color:rgba(31,41,55,.9);font-weight:700}
        .nav a.active{background:rgba(255,255,255,.95);border-color:rgba(236,72,153,.45);color:rgba(236,72,153,.95)}
        .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px rgba(31,38,135,.18);overflow:hidden}
        .panelHeader{padding:10px 12px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:space-between}
        .panelTitle{font-weight:800}
        .btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.75);cursor:pointer}
        .btn.primary{border-color:rgba(236,72,153,.55);background:linear-gradient(135deg,var(--primary) 0%,var(--primary2) 100%);color:#fff}
        #logsPre{margin:0;padding:12px;height:70vh;overflow:auto;font-family:var(--mono);font-size:12px;background:rgba(255,255,255,.55)}
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="brand"><span>🍈</span><span>运行日志</span></div>
        </header>
        <nav class="nav">
            <a href="/index.html">对话</a>
            <a href="/logs.html" class="active">日志</a>
            <a href="/config.html">配置</a>
            <a href="/templates.html">模板</a>
            <a href="/memories.html">记忆</a>
            <a href="/cookies.html">Cookie</a>
        </nav>
        <section class="card">
            <div class="panelHeader">
                <div class="panelTitle">运行日志</div>
                <div>
                    <button id="clearLogs" class="btn" type="button">清空</button>
                </div>
            </div>
            <pre id="logsPre"></pre>
        </section>
    </div>

    <script>
        (function(){
            function el(id){return document.getElementById(id)}
            var logWs = null
            function wsUrl(path){
                var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:'
                return protocol + '//' + window.location.host + path
            }
            function appendLog(text){
                var pre = el('logsPre')
                if (!pre) return
                pre.textContent += text
                pre.scrollTop = pre.scrollHeight
            }
            function connectLogWS(){
                try{ if (logWs) logWs.close() }catch(e){}
                logWs = new WebSocket(wsUrl('/api/logs/ws'))
                logWs.onmessage = function(ev){
                    var data = ev.data || ''
                    if (!data) return
                    appendLog(data.endsWith('\n') ? data : data + '\n')
                }
                logWs.onclose = function(){
                    setTimeout(connectLogWS, 3000)
                }
            }
            el('clearLogs').onclick = function(){ el('logsPre').textContent = '' }
            connectLogWS()
        })()
    </script>
</body>
</html>
