<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运行日志 - 小冬瓜智能助手</title>
    <style>
        :root{--bg:#f5f7fb;--card:#ffffff;--border:#e5e7eb;--muted:#6b1024;--text:#0f172a;--primary:#6366f1;--primary2:#8b5cf6;--radius:14px;--radius2:10px;--shadow:0 8px 24px rgba(15,23,42,.08);--mono:ui-monospace,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;--sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
        *{box-sizing:border-box}
        body{margin:0;font-family:var(--sans);color:var(--text);background:var(--bg)}
        .app{max-width:1120px;margin:0 auto;padding:16px}
        .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
        .panelHeader{padding:10px 12px;border-bottom:1px solid var(--border);background:#f8fafc;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
        .panelTitle{font-weight:800}
        .btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:#fff;cursor:pointer}
        .btn.primary{border-color:#c7d2fe;background:linear-gradient(135deg,var(--primary) 0%,var(--primary2) 100%);color:#fff}
        #logsPre{margin:0;padding:12px;height:70vh;overflow:auto;font-family:var(--mono);font-size:12px;background:#fff;border-top:1px solid var(--border)}
    </style>
</head>
<body>
    <div class="app">
        <div id="shell"></div>
        <section class="card">
            <div class="panelHeader">
                <div class="panelTitle">运行日志</div>
                <div>
                    <button id="clearLogs" class="btn" type="button">清空</button>
                </div>
            </div>
            <pre id="logsPre"></pre>
        </section>
    </div>

    <script src="/shell.js"></script>
    <script>renderShell({title:'日志'})</script>
    <script>
        (function(){
            function el(id){return document.getElementById(id)}
            var logWs = null
            function wsUrl(path){
                var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:'
                return protocol + '//' + window.location.host + path
            }
            function appendLog(text){
                var pre = el('logsPre')
                if (!pre) return
                pre.textContent += text
                pre.scrollTop = pre.scrollHeight
            }
            function connectLogWS(){
                try{ if (logWs) logWs.close() }catch(e){}
                logWs = new WebSocket(wsUrl('/api/logs/ws'))
                logWs.onmessage = function(ev){
                    var data = ev.data || ''
                    if (!data) return
                    appendLog(data.endsWith('\n') ? data : data + '\n')
                }
                logWs.onclose = function(){
                    setTimeout(connectLogWS, 3000)
                }
            }
            el('clearLogs').onclick = function(){ el('logsPre').textContent = '' }
            connectLogWS()
        })()
    </script>
</body>
</html>
