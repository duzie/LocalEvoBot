<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie 管理 - 小冬瓜智能助手</title>
    <style>
        :root{--bg:#f5f7fb;--card:#ffffff;--border:#e5e7eb;--muted:#6b7280;--text:#0f172a;--primary:#6366f1;--primary2:#8b5cf6;--radius:14px;--radius2:10px;--shadow:0 8px 24px rgba(15,23,42,.08);--mono:ui-monospace,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;--sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
        *{box-sizing:border-box}
        body{margin:0;font-family:var(--sans);color:var(--text);background:var(--bg)}
        .app{max-width:1120px;margin:0 auto;padding:16px}
        .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
        .panelHeader{padding:10px 12px;border-bottom:1px solid var(--border);background:#f8fafc;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
        .panelTitle{font-weight:800}
        .btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:#fff;cursor:pointer}
        .btn.primary{border-color:#c7d2fe;background:linear-gradient(135deg,var(--primary) 0%,var(--primary2) 100%);color:#fff}
        .btn.danger{border-color:#fca5a5;background:linear-gradient(135deg,#ef4444 0%,#f97316 100%);color:#fff}
        .tableWrap{padding:12px;overflow:auto}
        table{width:100%;border-collapse:collapse;font-size:12px;min-width:640px}
        th,td{padding:8px;border-bottom:1px solid #f1f5f9;text-align:left;vertical-align:top}
        th{font-weight:800;background:#f8fafc;position:sticky;top:0}
        .detail{padding:12px;border-top:1px solid var(--border);background:#f8fafc;display:none}
        .detail.active{display:block}
        .mono{font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word}
        .help{font-size:12px;color:var(--muted)}
    </style>
</head>
<body>
    <div class="app">
        <div id="shell"></div>

        <section class="card">
            <div class="panelHeader">
                <div class="panelTitle">Cookie 列表</div>
                <button id="refreshBtn" class="btn" type="button">刷新</button>
            </div>
            <div class="tableWrap">
                <table>
                    <thead>
                        <tr>
                            <th>域名</th>
                            <th>数量</th>
                            <th>更新时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="cookieBody"></tbody>
                </table>
                <div id="cookieEmpty" class="help" style="padding:8px 0;"></div>
            </div>
            <div id="cookieDetail" class="detail">
                <div class="panelTitle">详情</div>
                <pre id="cookieDetailText" class="mono"></pre>
            </div>
        </section>
    </div>

    <script src="/shell.js"></script>
    <script>renderShell({title:'Cookie'})</script>
    <script>
        (function(){
            function el(id){return document.getElementById(id)}
            function renderList(list){
                var body = el('cookieBody')
                body.textContent = ''
                var empty = el('cookieEmpty')
                empty.textContent = ''
                if (!list || !list.length){
                    empty.textContent = '暂无记录'
                    return
                }
                list.forEach(function(item){
                    var row = document.createElement('tr')
                    var domain = item.domain || item.file || ''
                    var count = item.count == null ? '' : String(item.count)
                    var updated = item.updated_at || ''
                    ;[domain, count, updated].forEach(function(text){
                        var cell = document.createElement('td')
                        cell.textContent = text
                        row.appendChild(cell)
                    })
                    var actions = document.createElement('td')
                    var viewBtn = document.createElement('button')
                    viewBtn.className = 'btn'
                    viewBtn.type = 'button'
                    viewBtn.textContent = '查看'
                    viewBtn.onclick = function(){ loadDetail(domain) }
                    var delBtn = document.createElement('button')
                    delBtn.className = 'btn danger'
                    delBtn.type = 'button'
                    delBtn.textContent = '删除'
                    delBtn.onclick = function(){ deleteCookie(domain) }
                    actions.appendChild(viewBtn)
                    actions.appendChild(delBtn)
                    row.appendChild(actions)
                    body.appendChild(row)
                })
            }

            function loadList(){
                fetch('/api/chat/cookies').then(function(r){return r.json()}).then(function(data){
                    renderList(data.items || [])
                }).catch(function(e){
                    var empty = el('cookieEmpty')
                    empty.textContent = '加载失败: ' + e
                })
            }

            function loadDetail(domain){
                if (!domain) return
                fetch('/api/chat/cookies/' + encodeURIComponent(domain)).then(function(r){return r.json()}).then(function(data){
                    el('cookieDetailText').textContent = JSON.stringify(data, null, 2)
                    el('cookieDetail').classList.add('active')
                }).catch(function(e){
                    el('cookieDetailText').textContent = '加载失败: ' + e
                    el('cookieDetail').classList.add('active')
                })
            }

            function deleteCookie(domain){
                if (!confirm('确认删除 ' + domain + ' 的 Cookie？')) return
                fetch('/api/chat/cookies/' + encodeURIComponent(domain), { method: 'DELETE' }).then(function(res){
                    if (res.ok){
                        loadList()
                        el('cookieDetail').classList.remove('active')
                    }else{
                        alert('删除失败 (' + res.status + ')')
                    }
                }).catch(function(e){ alert('删除出错 ' + e) })
            }

            el('refreshBtn').onclick = loadList
            loadList()
        })()
    </script>
</body>
</html>
