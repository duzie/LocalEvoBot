<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技能管理 - 小冬瓜智能助手</title>
    <style>
        :root{--bg:#f5f7fb;--card:#ffffff;--border:#e5e7eb;--muted:#6b7280;--text:#0f172a;--primary:#6366f1;--primary2:#8b5cf6;--radius:14px;--radius2:10px;--shadow:0 8px 24px rgba(15,23,42,.08);--mono:ui-monospace,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;--sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
        *{box-sizing:border-box}
        body{margin:0;font-family:var(--sans);color:var(--text);background:var(--bg)}
        .app{max-width:1240px;margin:0 auto;padding:16px}
        .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
        .panelHeader{padding:10px 12px;border-bottom:1px solid var(--border);background:#f8fafc;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
        .panelTitle{font-weight:800}
        .btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer}
        .btn.primary{border-color:#c7d2fe;background:linear-gradient(135deg,var(--primary) 0%,var(--primary2) 100%);color:#fff}
        .input,.select{height:36px;border-radius:10px;border:1px solid var(--border);background:#fff;padding:0 12px;outline:none;min-width:160px}
        .filters{padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
        .skillsGrid{display:grid;grid-template-columns:320px 1fr;gap:12px;padding:12px}
        .listPanel{border:1px solid var(--border);border-radius:12px;background:#f8fafc;overflow:hidden}
        .listHead{padding:10px 12px;border-bottom:1px solid var(--border);font-weight:800;background:#eef2ff}
        .skillList{max-height:70vh;overflow:auto;padding:6px}
        .skillItem{padding:10px;border-radius:10px;border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;gap:6px;margin-bottom:6px;background:#fff}
        .skillItem.active{border-color:#c7d2fe;background:#eef2ff}
        .skillRow{display:flex;align-items:center;gap:10px}
        .skillName{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .check{width:16px;height:16px}
        .skillMeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
        .pill{font-size:12px;color:var(--muted);background:#f1f5f9;border:1px solid #e2e8f0;padding:4px 8px;border-radius:999px}
        .detailPanel{border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}
        .detailBody{padding:12px;display:flex;flex-direction:column;gap:12px}
        .detailTitle{font-weight:800;font-size:16px}
        .kv{display:grid;grid-template-columns:120px 1fr;gap:8px;font-size:12px}
        .kv .key{color:var(--muted);font-weight:700}
        .mono{font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word}
        .toolList{display:flex;flex-direction:column;gap:6px}
        .toolItem{padding:8px;border-radius:10px;border:1px solid #e2e8f0;background:#f8fafc;font-size:12px}
        .empty{font-size:12px;color:var(--muted)}
        .loadBox{border:1px dashed #cbd5f5;border-radius:12px;padding:10px;background:#eef2ff;font-size:12px}
        .modalMask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px}
        .modal{width:min(920px,100%);background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
        .modalHeader{padding:12px 14px;border-bottom:1px solid var(--border);background:#f8fafc;display:flex;align-items:center;justify-content:space-between;gap:10px}
        .modalBody{padding:12px;display:flex;flex-direction:column;gap:10px}
        .textarea{width:100%;min-height:320px;border-radius:12px;border:1px solid var(--border);padding:10px;font-family:var(--mono);font-size:12px;outline:none;resize:vertical}
        .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
        .row .input{min-width:240px}
        @media (max-width:960px){.skillsGrid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="app">
        <div id="shell"></div>

        <section class="card">
            <div class="panelHeader">
                <div class="panelTitle">技能列表</div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                    <span class="pill">已选 <span id="selectedCount">0</span></span>
                    <input id="searchInput" class="input" type="text" placeholder="搜索技能/工具" autocomplete="off" />
                    <select id="scopeSelect" class="select">
                        <option value="all">全部</option>
                        <option value="skills">核心技能</option>
                        <option value="auto_skills">自动技能</option>
                    </select>
                    <button id="selectAllBtn" class="btn" type="button">全选(过滤)</button>
                    <button id="clearSelectionBtn" class="btn" type="button">清空选择</button>
                    <button id="createSkillBtn" class="btn primary" type="button">新增技能</button>
                    <button id="exportBtn" class="btn primary" type="button">导出Agent</button>
                    <button id="refreshBtn" class="btn" type="button">刷新</button>
                    <button id="reloadBtn" class="btn primary" type="button">重载技能</button>
                </div>
            </div>
            <div class="skillsGrid">
                <div class="listPanel">
                    <div class="listHead">技能</div>
                    <div id="skillList" class="skillList"></div>
                </div>
                <div class="detailPanel">
                    <div class="listHead">详情</div>
                    <div id="detailBody" class="detailBody"></div>
                </div>
            </div>
        </section>
    </div>

    <div id="exportMask" class="modalMask">
        <div class="modal">
            <div class="modalHeader">
                <div class="panelTitle">导出 Agent</div>
                <button id="exportCloseBtn" class="btn" type="button">关闭</button>
            </div>
            <div class="modalBody">
                <div class="row">
                    <input id="exportFilename" class="input" type="text" placeholder="文件名（不含 .zip）" autocomplete="off" />
                    <button id="genPromptBtn" class="btn" type="button">自动生成提示词</button>
                    <button id="saveZipBtn" class="btn primary" type="button">另存为 ZIP</button>
                </div>
                <textarea id="promptEditor" class="textarea" placeholder="在这里编辑导出 Agent 的 system prompt"></textarea>
                <div class="empty">skillgen_skill 不允许导出；system_skill 会自动精简为记忆/经验相关工具。</div>
            </div>
        </div>
    </div>

    <div id="createMask" class="modalMask">
        <div class="modal">
            <div class="modalHeader">
                <div class="panelTitle">新增技能</div>
                <button id="createCloseBtn" class="btn" type="button">关闭</button>
            </div>
            <div class="modalBody">
                <div class="row">
                    <input id="createSkillName" class="input" type="text" placeholder="skill_name（可选）" autocomplete="off" />
                    <label class="pill"><input id="createOverwrite" type="checkbox" /> 覆盖同名</label>
                    <label class="pill"><input id="createDryRun" type="checkbox" checked /> 仅预览</label>
                        <label class="pill"><input id="createGenImpl" type="checkbox" /> 生成实现(LLM)</label>
                        <label class="pill"><input id="createJudge" type="checkbox" /> 验收打分(LLM)</label>
                        <input id="createJudgeThreshold" class="input" type="number" min="0" max="100" value="75" style="max-width:110px" />
                        <label class="pill"><input id="createAllowNetwork" type="checkbox" /> 允许联网</label>
                    <button id="createRunBtn" class="btn primary" type="button">生成</button>
                </div>
                <textarea id="createRequest" class="textarea" placeholder="输入自然语言需求（或直接粘贴 JSON 规格）"></textarea>
                <textarea id="createOutput" class="textarea" style="min-height:220px" placeholder="输出" readonly></textarea>
                <div class="empty">提示：未配置模型密钥时，可先粘贴 JSON 规格并取消“仅预览”生成文件。</div>
            </div>
        </div>
    </div>

    <script src="/shell.js"></script>
    <script>renderShell({title:'技能'})</script>
    <script>
        (function(){
            function el(id){return document.getElementById(id)}
            var state = {skills:[], filtered:[], selected:null, loadability:null, selectedKeys:{}}

            function keyOf(skill){
                return skill.scope + ':' + skill.id
            }

            function setSelected(skill, checked){
                var k = keyOf(skill)
                if (checked) state.selectedKeys[k] = true
                else delete state.selectedKeys[k]
                renderSelectedCount()
            }

            function renderSelectedCount(){
                el('selectedCount').textContent = String(Object.keys(state.selectedKeys).length)
            }

            function getSelectedSkills(){
                var keys = state.selectedKeys
                return state.skills.filter(function(s){ return !!keys[keyOf(s)] })
            }

            function generateDefaultPrompt(skills){
                var lines = []
                lines.push('你是一个专用的自动化 Agent。')
                lines.push('')
                lines.push('=== 约束 ===')
                lines.push('1. 仅使用“可用技能”里列出的工具完成任务。')
                lines.push('2. 如果缺少工具或无权限，明确说明无法完成，并给出你需要的工具名称。')
                lines.push('3. 每次回复最后一行必须输出 `STATE: DONE` 或 `STATE: CONTINUE`。')
                lines.push('')
                lines.push('=== 可用技能 ===')
                if (!skills.length){
                    lines.push('- (空)')
                } else {
                    skills.forEach(function(s){
                        lines.push('- ' + s.name + ' (' + s.scope + '/' + s.id + ')')
                        var toolNames = (s.tools || []).map(function(t){return t.name}).filter(Boolean)
                        if (toolNames.length){
                            lines.push('  工具: ' + toolNames.join(', '))
                        }
                    })
                }
                lines.push('')
                if (skills.some(function(s){ return s.scope === 'skills' && s.id === 'system_skill' })){
                    lines.push('=== 记忆与经验 ===')
                    lines.push('1) 遇到不确定或缺少背景时，先调用 `get_operation_experience` 检索长期经验。')
                    lines.push('2) 只有用户明确要求“搜索所有记忆/搜全部记忆”时，才调用 `search_short_term_memory`。')
                    lines.push('3) 任务完成后可调用 `add_operation_experience` 记录新经验。')
                    lines.push('')
                }
                return lines.join('\n')
            }

            function openExportModal(){
                var skills = getSelectedSkills()
                if (!skills.length){
                    alert('请先勾选要导出的技能')
                    return
                }
                el('exportMask').style.display = 'flex'
                var name = 'agent'
                if (skills.length === 1) name = skills[0].id
                el('exportFilename').value = name
                el('promptEditor').value = generateDefaultPrompt(skills)
            }

            function closeExportModal(){
                el('exportMask').style.display = 'none'
            }

            function openCreateModal(){
                el('createMask').style.display = 'flex'
                el('createRequest').value = ''
                el('createOutput').value = ''
                el('createSkillName').value = ''
                el('createOverwrite').checked = false
                el('createDryRun').checked = true
                el('createGenImpl').checked = false
                el('createJudge').checked = false
                el('createJudgeThreshold').value = '75'
                el('createAllowNetwork').checked = false
            }

            function closeCreateModal(){
                el('createMask').style.display = 'none'
            }

            async function runCreate(){
                var req = (el('createRequest').value || '').trim()
                if (!req){
                    alert('请输入需求或 JSON 规格')
                    return
                }
                var payload = {
                    request: req,
                    skill_name: (el('createSkillName').value || '').trim(),
                    overwrite: !!el('createOverwrite').checked,
                    dry_run: !!el('createDryRun').checked,
                    generate_impl: !!el('createGenImpl').checked,
                    judge: !!el('createJudge').checked,
                    judge_threshold: parseInt(el('createJudgeThreshold').value || '75', 10) || 75,
                    allow_network: !!el('createAllowNetwork').checked
                }
                el('createRunBtn').disabled = true
                el('createOutput').value = '处理中...'
                try{
                    var resp = await fetch('/api/skills/generate', {
                        method:'POST',
                        headers:{'Content-Type':'application/json'},
                        body: JSON.stringify(payload)
                    })
                    var data = await resp.json().catch(function(){ return null })
                    if (!resp.ok){
                        var msg = data && data.detail ? data.detail : ('HTTP ' + resp.status)
                        el('createOutput').value = '失败：' + msg
                        return
                    }
                    el('createOutput').value = JSON.stringify(data, null, 2)
                    if (data && data.ok && !data.dry_run){
                        loadSkills()
                    }
                }catch(e){
                    el('createOutput').value = '失败：' + e
                }finally{
                    el('createRunBtn').disabled = false
                }
            }

            function parseContentDispositionFilename(v){
                if (!v) return ''
                var m = /filename="([^"]+)"/.exec(v)
                if (m && m[1]) return m[1]
                return ''
            }

            async function saveZipWithDialog(blob, suggestedName){
                if (window.showSaveFilePicker){
                    var handle = await window.showSaveFilePicker({
                        suggestedName: suggestedName || 'agent.zip',
                        types: [{description:'ZIP', accept:{'application/zip':['.zip']}}]
                    })
                    var writable = await handle.createWritable()
                    await writable.write(blob)
                    await writable.close()
                    return
                }
                var url = URL.createObjectURL(blob)
                var a = document.createElement('a')
                a.href = url
                a.download = suggestedName || 'agent.zip'
                document.body.appendChild(a)
                a.click()
                a.remove()
                setTimeout(function(){ URL.revokeObjectURL(url) }, 30000)
            }

            function scopeLabel(scope){
                return scope === 'skills' ? '核心' : '自动'
            }

            function buildSkillItem(skill){
                var wrap = document.createElement('div')
                wrap.className = 'skillItem' + (state.selected && state.selected.id === skill.id && state.selected.scope === skill.scope ? ' active' : '')
                var row = document.createElement('div')
                row.className = 'skillRow'
                var cb = document.createElement('input')
                cb.type = 'checkbox'
                cb.className = 'check'
                var exportBlocked = (skill.scope === 'skills' && skill.id === 'skillgen_skill')
                if (exportBlocked) cb.disabled = true
                cb.checked = !!state.selectedKeys[keyOf(skill)]
                cb.onclick = function(e){
                    e.stopPropagation()
                    if (exportBlocked){
                        alert('skillgen_skill 不允许导出')
                        cb.checked = false
                        return
                    }
                    setSelected(skill, cb.checked)
                }
                var title = document.createElement('div')
                title.className = 'skillName'
                title.textContent = skill.name
                row.appendChild(cb)
                row.appendChild(title)
                var meta = document.createElement('div')
                meta.className = 'skillMeta'
                var pillScope = document.createElement('span')
                pillScope.className = 'pill'
                pillScope.textContent = scopeLabel(skill.scope)
                var pillTools = document.createElement('span')
                pillTools.className = 'pill'
                pillTools.textContent = '工具 ' + (skill.tool_count || 0)
                meta.appendChild(pillScope)
                meta.appendChild(pillTools)
                wrap.appendChild(row)
                wrap.appendChild(meta)
                wrap.onclick = function(){
                    state.selected = skill
                    state.loadability = null
                    renderList()
                    renderDetail()
                }
                return wrap
            }

            function renderList(){
                var list = el('skillList')
                list.textContent = ''
                if (!state.filtered.length){
                    var empty = document.createElement('div')
                    empty.className = 'empty'
                    empty.textContent = '暂无技能'
                    list.appendChild(empty)
                    return
                }
                state.filtered.forEach(function(skill){
                    list.appendChild(buildSkillItem(skill))
                })
                renderSelectedCount()
            }

            function kvRow(key, value, mono){
                var row = document.createElement('div')
                row.className = 'kv'
                var k = document.createElement('div')
                k.className = 'key'
                k.textContent = key
                var v = document.createElement('div')
                v.textContent = value || '-'
                if (mono) v.className = 'mono'
                row.appendChild(k)
                row.appendChild(v)
                return row
            }

            function renderToolList(tools){
                var wrap = document.createElement('div')
                wrap.className = 'toolList'
                if (!tools || !tools.length){
                    var empty = document.createElement('div')
                    empty.className = 'empty'
                    empty.textContent = '暂无工具'
                    wrap.appendChild(empty)
                    return wrap
                }
                tools.forEach(function(t){
                    var item = document.createElement('div')
                    item.className = 'toolItem'
                    item.textContent = t.name + (t.description ? (' - ' + t.description) : '')
                    wrap.appendChild(item)
                })
                return wrap
            }

            function renderLoadability(){
                if (!state.loadability) return null
                var box = document.createElement('div')
                box.className = 'loadBox'
                var status = state.loadability.ok ? '可加载' : '加载异常'
                box.appendChild(kvRow('状态', status))
                box.appendChild(kvRow('入口', state.loadability.entry, true))
                var tools = (state.loadability.tools_found || []).join('\n')
                box.appendChild(kvRow('发现工具', tools || '-', true))
                var errors = (state.loadability.errors || []).join('\n')
                if (errors) box.appendChild(kvRow('错误', errors, true))
                return box
            }

            function renderDetail(){
                var body = el('detailBody')
                body.textContent = ''
                if (!state.selected){
                    var empty = document.createElement('div')
                    empty.className = 'empty'
                    empty.textContent = '请选择一个技能'
                    body.appendChild(empty)
                    return
                }
                var title = document.createElement('div')
                title.className = 'detailTitle'
                title.textContent = state.selected.name
                body.appendChild(title)
                body.appendChild(kvRow('范围', scopeLabel(state.selected.scope)))
                body.appendChild(kvRow('版本', state.selected.version))
                body.appendChild(kvRow('描述', state.selected.description))
                body.appendChild(kvRow('入口', state.selected.entry, true))
                body.appendChild(kvRow('平台', (state.selected.platforms || []).join(', ')))
                body.appendChild(kvRow('依赖', (state.selected.dependencies || []).join(', ')))
                var toolsTitle = document.createElement('div')
                toolsTitle.className = 'panelTitle'
                toolsTitle.textContent = '工具'
                body.appendChild(toolsTitle)
                body.appendChild(renderToolList(state.selected.tools || []))
                var btnRow = document.createElement('div')
                btnRow.style.display = 'flex'
                btnRow.style.gap = '8px'
                var testBtn = document.createElement('button')
                testBtn.className = 'btn'
                testBtn.textContent = '可加载性检测'
                testBtn.onclick = function(){
                    testLoadability(state.selected)
                }
                btnRow.appendChild(testBtn)
                body.appendChild(btnRow)
                var loadBox = renderLoadability()
                if (loadBox) body.appendChild(loadBox)
            }

            function applyFilter(){
                var keyword = el('searchInput').value.trim().toLowerCase()
                var scope = el('scopeSelect').value
                state.filtered = state.skills.filter(function(s){
                    if (scope !== 'all' && s.scope !== scope) return false
                    if (!keyword) return true
                    var text = (s.name + ' ' + (s.description || '')).toLowerCase()
                    if (text.indexOf(keyword) !== -1) return true
                    var tools = s.tools || []
                    return tools.some(function(t){
                        return ((t.name || '') + ' ' + (t.description || '')).toLowerCase().indexOf(keyword) !== -1
                    })
                })
                renderList()
            }

            function loadSkills(){
                fetch('/api/skills').then(function(r){return r.json()}).then(function(data){
                    state.skills = data.skills || []
                    state.filtered = state.skills.slice()
                    if (state.selected){
                        var next = state.skills.find(function(s){return s.id === state.selected.id && s.scope === state.selected.scope})
                        state.selected = next || null
                    }
                    applyFilter()
                    renderDetail()
                    renderSelectedCount()
                }).catch(function(e){
                    alert('读取技能失败 ' + e)
                })
            }

            function reloadSkills(){
                fetch('/api/skills/reload', {method:'POST'}).then(function(r){return r.json()}).then(function(){
                    loadSkills()
                }).catch(function(e){
                    alert('重载失败 ' + e)
                })
            }

            function testLoadability(skill){
                state.loadability = null
                renderDetail()
                var path = '/api/skills/' + skill.scope + '/' + skill.id + '/loadability'
                fetch(path).then(function(r){return r.json()}).then(function(data){
                    state.loadability = data
                    renderDetail()
                }).catch(function(e){
                    state.loadability = {ok:false, entry: skill.entry, tools_found: [], errors: [String(e)]}
                    renderDetail()
                })
            }

            el('searchInput').oninput = applyFilter
            el('scopeSelect').onchange = applyFilter
            el('refreshBtn').onclick = loadSkills
            el('reloadBtn').onclick = reloadSkills
            el('selectAllBtn').onclick = function(){
                state.filtered.forEach(function(s){ setSelected(s, true) })
                renderList()
            }
            el('clearSelectionBtn').onclick = function(){
                state.selectedKeys = {}
                renderList()
            }
            el('createSkillBtn').onclick = openCreateModal
            el('exportBtn').onclick = openExportModal
            el('exportCloseBtn').onclick = closeExportModal
            el('exportMask').onclick = function(e){
                if (e.target === el('exportMask')) closeExportModal()
            }
            el('createCloseBtn').onclick = closeCreateModal
            el('createMask').onclick = function(e){
                if (e.target === el('createMask')) closeCreateModal()
            }
            el('createRunBtn').onclick = runCreate
            el('genPromptBtn').onclick = function(){
                el('promptEditor').value = generateDefaultPrompt(getSelectedSkills())
            }
            el('saveZipBtn').onclick = async function(){
                var skills = getSelectedSkills().map(function(s){ return {scope:s.scope, id:s.id} })
                if (!skills.length){
                    alert('请先勾选要导出的技能')
                    return
                }
                var filename = (el('exportFilename').value || '').trim() || 'agent'
                var agentPrompt = el('promptEditor').value || ''
                el('saveZipBtn').disabled = true
                try{
                    var resp = await fetch('/api/skills/export_zip', {
                        method:'POST',
                        headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({skills: skills, filename: filename, agent_prompt: agentPrompt})
                    })
                    if (!resp.ok){
                        var err = await resp.json().catch(function(){ return null })
                        var msg = err && err.detail ? err.detail : ('HTTP ' + resp.status)
                        alert('导出失败：' + msg)
                        return
                    }
                    var cd = resp.headers.get('Content-Disposition') || ''
                    var suggested = parseContentDispositionFilename(cd) || (filename + '.zip')
                    var blob = await resp.blob()
                    await saveZipWithDialog(blob, suggested)
                    closeExportModal()
                }catch(e){
                    alert('导出失败：' + e)
                }finally{
                    el('saveZipBtn').disabled = false
                }
            }

            loadSkills()
        })()
    </script>
</body>
</html>
