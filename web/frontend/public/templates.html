<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模板管理 - 小冬瓜智能助手</title>
    <style>
        :root{--bg:#f5f7fb;--card:#ffffff;--border:#e5e7eb;--muted:#6b7280;--text:#0f172a;--primary:#6366f1;--primary2:#8b5cf6;--radius:14px;--radius2:10px;--shadow:0 8px 24px rgba(15,23,42,.08);--mono:ui-monospace,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;--sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
        *{box-sizing:border-box}
        body{margin:0;font-family:var(--sans);color:var(--text);background:var(--bg)}
        .app{max-width:1120px;margin:0 auto;padding:16px}
        .header{margin-top:6px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
        .brand{font-weight:800;display:flex;align-items:center;gap:10px}
        .nav{margin:12px 0;display:flex;gap:8px;flex-wrap:wrap}
        .nav a{display:inline-block;padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--border);text-decoration:none;color:#334155;font-weight:700}
        .nav a.active{background:#eef2ff;border-color:#c7d2fe;color:#4338ca}
        .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
        .panelHeader{padding:10px 12px;border-bottom:1px solid var(--border);background:#f8fafc;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
        .panelTitle{font-weight:800}
        .btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:#fff;cursor:pointer}
        .btn.primary{border-color:#c7d2fe;background:linear-gradient(135deg,var(--primary) 0%,var(--primary2) 100%);color:#fff}
        .btn.danger{border-color:#fca5a5;background:linear-gradient(135deg,#ef4444 0%,#f97316 100%);color:#fff}
        .tmplList{padding:12px;display:flex;flex-direction:column;gap:12px;max-height:65vh;overflow:auto}
        .tmplCard{border:1px solid var(--border);border-radius:12px;background:#fff;padding:12px;display:flex;flex-direction:column;gap:10px}
        .tmplHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
        .tmplMeta{font-size:12px;color:var(--muted)}
        .tmplTags{display:flex;gap:6px;flex-wrap:wrap}
        .tmplTag{padding:2px 8px;border-radius:999px;background:#f1f5f9;border:1px solid #e2e8f0;font-size:12px;color:var(--muted)}
        .input{height:36px;border-radius:10px;border:1px solid var(--border);background:#fff;padding:0 12px;outline:none;min-width:180px}
        .textarea{width:100%;min-height:140px;border-radius:10px;border:1px solid var(--border);background:#fff;padding:10px 12px;outline:none;font-family:var(--mono);font-size:12px}
        .help{font-size:12px;color:var(--muted)}
        .pager{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;border-top:1px solid var(--border);background:#f8fafc}
        .pager .info{font-size:12px;color:var(--muted)}
        .pager .btn[disabled]{opacity:.5;cursor:not-allowed}
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="brand"><span>🍈</span><span>模板管理</span></div>
        </header>
        <nav class="nav">
            <a href="/index.html">对话</a>
            <a href="/logs.html">日志</a>
            <a href="/config.html">配置</a>
            <a href="/skills.html">技能</a>
            <a href="/templates.html" class="active">模板</a>
            <a href="/memories.html">记忆</a>
            <a href="/cookies.html">Cookie</a>
        </nav>

        <section class="card">
            <div class="panelHeader">
                <div class="panelTitle">任务模板</div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                    <input id="limitInput" class="input" type="number" min="1" max="500" value="20" />
                    <button id="refreshBtn" class="btn" type="button">刷新</button>
                </div>
            </div>
            <div id="tmplList" class="tmplList"></div>
            <div class="pager">
                <button id="prevPageBtn" class="btn" type="button">上一页</button>
                <button id="nextPageBtn" class="btn" type="button">下一页</button>
                <span id="pageInfo" class="info"></span>
            </div>
        </section>
    </div>

    <script>
        (function(){
            function el(id){return document.getElementById(id)}
            function buildTag(text){
                var t = document.createElement('span')
                t.className = 'tmplTag'
                t.textContent = text
                return t
            }

            var state = {page:1,hasNext:false}

            function updatePager(){
                el('pageInfo').textContent = '第 ' + state.page + ' 页'
                el('prevPageBtn').disabled = state.page <= 1
                el('nextPageBtn').disabled = !state.hasNext
            }

            function renderTemplates(list){
                var wrap = el('tmplList')
                wrap.textContent = ''
                if (!list || !list.length){
                    var empty = document.createElement('div')
                    empty.className = 'help'
                    empty.textContent = '暂无模板'
                    wrap.appendChild(empty)
                    return
                }
                list.forEach(function(item){
                    var card = document.createElement('div')
                    card.className = 'tmplCard'

                    var header = document.createElement('div')
                    header.className = 'tmplHeader'
                    var title = document.createElement('div')
                    title.textContent = item.name || '未命名模板'
                    title.style.fontWeight = '800'
                    var meta = document.createElement('div')
                    meta.className = 'tmplMeta'
                    meta.textContent = item.created_at || ''
                    header.appendChild(title)
                    header.appendChild(meta)

                    var tagsWrap = document.createElement('div')
                    tagsWrap.className = 'tmplTags'
                    var tags = item.tags || []
                    if (tags.length){
                        tags.forEach(function(tag){ tagsWrap.appendChild(buildTag(tag)) })
                    }

                    var fields = document.createElement('div')
                    fields.className = 'tmplMeta'
                    fields.textContent = [item.scope, item.project_id, item.user_id].filter(Boolean).join(' · ')

                    var tagInputRow = document.createElement('div')
                    tagInputRow.className = 'tmplHeader'
                    var tagInput = document.createElement('input')
                    tagInput.className = 'input'
                    tagInput.placeholder = '标签 (逗号分隔)'
                    tagInput.value = (tags || []).join(', ')
                    var saveBtn = document.createElement('button')
                    saveBtn.className = 'btn primary'
                    saveBtn.type = 'button'
                    saveBtn.textContent = '保存'
                    var delBtn = document.createElement('button')
                    delBtn.className = 'btn danger'
                    delBtn.type = 'button'
                    delBtn.textContent = '删除'
                    tagInputRow.appendChild(tagInput)
                    tagInputRow.appendChild(saveBtn)
                    tagInputRow.appendChild(delBtn)

                    var textarea = document.createElement('textarea')
                    textarea.className = 'textarea'
                    textarea.value = item.raw || (item.template ? JSON.stringify(item.template, null, 2) : '')

                    saveBtn.onclick = function(){
                        var raw = textarea.value || ''
                        var obj = null
                        try{
                            obj = JSON.parse(raw)
                        }catch(e){
                            alert('模板 JSON 解析失败')
                            return
                        }
                        var tagList = (tagInput.value || '').split(',').map(function(t){ return t.trim() }).filter(Boolean)
                        fetch('/api/config/templates/' + encodeURIComponent(item.id), {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ template: obj, tags: tagList })
                        }).then(function(res){
                            if (res.ok){
                                alert('已保存')
                                loadTemplates()
                            }else{
                                alert('保存失败 (' + res.status + ')')
                            }
                        }).catch(function(e){
                            alert('保存出错 ' + e)
                        })
                    }

                    delBtn.onclick = function(){
                        if (!confirm('确认删除该模板？')) return
                        fetch('/api/config/templates/' + encodeURIComponent(item.id), { method: 'DELETE' }).then(function(res){
                            if (res.ok){
                                loadTemplates()
                            }else{
                                alert('删除失败 (' + res.status + ')')
                            }
                        }).catch(function(e){ alert('删除出错 ' + e) })
                    }

                    card.appendChild(header)
                    if (tagsWrap.childNodes.length) card.appendChild(tagsWrap)
                    if (fields.textContent) card.appendChild(fields)
                    card.appendChild(textarea)
                    card.appendChild(tagInputRow)
                    wrap.appendChild(card)
                })
            }

            function loadTemplates(){
                var limit = parseInt(el('limitInput').value || '20', 10)
                if (isNaN(limit) || limit <= 0) limit = 20
                var offset = (state.page - 1) * limit
                var params = new URLSearchParams()
                params.append('limit', String(limit))
                params.append('offset', String(offset))
                fetch('/api/config/templates?' + params.toString()).then(function(r){return r.json()}).then(function(data){
                    var list = data.templates || []
                    state.hasNext = list.length >= limit
                    renderTemplates(list)
                    updatePager()
                }).catch(function(e){
                    var wrap = el('tmplList')
                    wrap.textContent = ''
                    var err = document.createElement('div')
                    err.className = 'help'
                    err.textContent = '加载模板失败: ' + e
                    wrap.appendChild(err)
                })
            }

            el('refreshBtn').onclick = function(){
                state.page = 1
                loadTemplates()
            }
            el('limitInput').onchange = function(){
                state.page = 1
                loadTemplates()
            }
            el('prevPageBtn').onclick = function(){
                if (state.page <= 1) return
                state.page -= 1
                loadTemplates()
            }
            el('nextPageBtn').onclick = function(){
                if (!state.hasNext) return
                state.page += 1
                loadTemplates()
            }
            loadTemplates()
        })()
    </script>
</body>
</html>
